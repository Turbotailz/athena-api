name: Daily Data Update

on:
  schedule:
    - cron: '0 9 * * *' # 9:00 UTC daily
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update Data
        run: npm run update-data

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Bump version
        if: steps.git-check.outputs.changes == 'true'
        run: |
          npx tsx scripts/sync-version.ts

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): update hero data and bump version"
          title: "chore(data): update hero data"
          body: |
            Automated data update.
            
            - Fetched latest data from StadiumBuilds and Blizzard.
            - Normalized data.
            - Bumped patch version.
          branch: automated-data-update
          base: main
          delete-branch: true

